name: V4.2 R10P Original Cash Alert Dispositions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/v4_2/r10p/review_20261003/**
      - src/r10p_verify_cash_alert_dispositions.py
      - .github/workflows/v4-2-r10p-cash-alert-dispositions.yml
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source verifier dependency
        run: python -m pip install -r requirements-r10f.txt
      - name: Original source integrity controls
        run: python tests/test_r10f_source_corrections.py
      - name: Retrieve sealed R10E sources
        uses: actions/download-artifact@v4
        with:
          name: r10e-primary-evidence-36336222379-1
          github-token: ${{ github.token }}
          run-id: '36336222379'
          path: ${{ runner.temp }}/r10p-sources
      - name: Verify all five original alert dispositions
        run: |
          python src/r10p_verify_cash_alert_dispositions.py \
            --registry data/v4_2/r10p/review_20261003/V4_2_R10P_ORIGINAL_CASH_ALERT_DISPOSITIONS.json \
            --sources "${RUNNER_TEMP}/r10p-sources/_temp/r10e_primary_sources" \
            --overlay data/v4_2/r10d/36303846263/V4_2_R10D_REAL_OVERLAYS.csv \
            --output "${RUNNER_TEMP}/r10p-receipt.json"
          cmp "${RUNNER_TEMP}/r10p-receipt.json" data/v4_2/r10p/review_20261003/V4_2_R10P_VERIFICATION_RECEIPT.json
          git diff --exit-code
      - name: Summary
        run: |
          python - <<'PYCODE'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'r10p-receipt.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## R10P original cash-alert review\n\n')
              out.write(f"{r['source_inputs_verified']} source facts, {r['equations_passed']} equations and {r['narrative_checks_passed']} excerpts verified.\n\n")
              out.write(f"{r['original_alerts_handled']}/{r['original_alerts']} original alert matches disposed; {r['original_alerts_still_open']} remains open.\n\n")
              out.write('Scope is original lexical matches only. Assistant documentary interpretation is not independent semantic validation. All ten aggregate cases remain open; no R11/R12, BUY/ADD, normalization or LIVE clearance.\n')
          PYCODE
