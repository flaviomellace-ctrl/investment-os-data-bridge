name: Probe FMP Market Data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe FMP endpoints
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python src/probe_fmp_market.py
