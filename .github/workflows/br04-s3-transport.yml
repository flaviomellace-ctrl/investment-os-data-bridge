name: BR-04 S3 Transport

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: br04-s3-transport
  cancel-in-progress: false

jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q src

      - name: Resolve latest S2-approved candidate
        shell: bash
        run: |
          S1_RUN_ID="$(
            python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path("data/staging/br04")
          found = []

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          for p in base.glob("*/evidence/br04_regression.json"):
              try:
                  j = json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  continue

              if j.get("phase") != "S2":
                  continue
              if j.get("overall_passed") is not True:
                  continue

              run_dir = p.parents[1]
              candidate = run_dir / "candidate" / "sp500_fundamentals.csv"
              if not candidate.exists():
                  continue

              expected_sha = str(j.get("candidate_sha256", "")).strip()
              if not expected_sha:
                  continue
              if sha256_file(candidate) != expected_sha:
                  continue

              found.append((p.stat().st_mtime, run_dir.name))

          if not found:
              raise SystemExit("No S2-approved BR-04 candidate found")

          print(max(found)[1])
          PY
          )"

          echo "S1_RUN_ID=${S1_RUN_ID}" >> "$GITHUB_ENV"
          echo "Using S2-approved S1 candidate run ${S1_RUN_ID}"

      - name: Run BR-04 S3 transport
        run: |
          python src/transport_br04_candidate.py \
            --s1-run-id "${S1_RUN_ID}"

      - name: Verify S3 outputs
        run: |
          ROOT="data/staging/br04/${S1_RUN_ID}"

          test -f "${ROOT}/candidate/fundamentals_chunks.json"
          test -f "${ROOT}/candidate/fundamentals_chunks.md"
          test -f "${ROOT}/evidence/br04_transport.json"
          test -f "${ROOT}/evidence/br04_transport.md"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["S1_RUN_ID"]
          root = Path("data/staging/br04") / run_id

          index = json.loads(
              (root / "candidate" / "fundamentals_chunks.json").read_text(
                  encoding="utf-8"
              )
          )
          report = json.loads(
              (root / "evidence" / "br04_transport.json").read_text(
                  encoding="utf-8"
              )
          )

          total_parts = int(index.get("total_parts", 0))
          if total_parts < 1:
              raise SystemExit("No transport chunks generated")

          parts = sorted(
              (root / "candidate").glob("sp500_fundamentals_part_*.csv")
          )
          if len(parts) != total_parts:
              raise SystemExit(
                  f"Chunk count mismatch: files={len(parts)} "
                  f"index={total_parts}"
              )

          if report.get("overall_passed") is not True:
              raise SystemExit("BR04-T20 did not pass")
          PY

      - name: Commit S3 transport evidence only
        run: |
          ROOT="data/staging/br04/${S1_RUN_ID}"

          git config user.name "investment-os-data-bridge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "${ROOT}/candidate/fundamentals_chunks.json" \
            "${ROOT}/candidate/fundamentals_chunks.md" \
            "${ROOT}/candidate"/sp500_fundamentals_part_*.csv \
            "${ROOT}/evidence/br04_transport.json" \
            "${ROOT}/evidence/br04_transport.md"

          if git diff --cached --quiet; then
            echo "Nessun nuovo output S3 da committare."
          else
            git commit -m "data: BR-04 S3 transport ${S1_RUN_ID}"
            git push
          fi

      - name: Enforce S3 gate
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["S1_RUN_ID"]
          p = (
              Path("data/staging/br04")
              / run_id
              / "evidence"
              / "br04_transport.json"
          )
          j = json.loads(p.read_text(encoding="utf-8"))

          print("overall_passed =", j.get("overall_passed"))
          print("test =", j.get("test"))

          if not j.get("overall_passed"):
              raise SystemExit(
                  "S3 transport failed. Do not proceed to S4."
              )
          PY
