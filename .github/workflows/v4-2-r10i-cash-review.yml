name: V4.2 R10I Cash Quality Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/r10f_verify_source_corrections.py
      - tests/test_r10f_source_corrections.py
      - requirements-r10f.txt
      - data/v4_2/r10i/review_20260928/**
      - .github/workflows/v4-2-r10i-cash-review.yml

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated source-review dependency
        run: python -m pip install -r requirements-r10f.txt
      - name: Synthetic source integrity tests
        run: python tests/test_r10f_source_corrections.py
      - name: Retrieve sealed R10E primary sources
        uses: actions/download-artifact@v4
        with:
          name: r10e-primary-evidence-36336222379-1
          github-token: ${{ github.token }}
          run-id: '36336222379'
          path: ${{ runner.temp }}/r10i-source-archive
      - name: Verify all reviewed source corrections
        run: |
          python src/r10f_verify_source_corrections.py \
            --registry data/v4_2/r10i/review_20260928/V4_2_R10I_CASH_REVIEW.json \
            --sources "${RUNNER_TEMP}/r10i-source-archive/_temp/r10e_primary_sources" \
            --output "${RUNNER_TEMP}/r10i-receipt.json"
          cmp "${RUNNER_TEMP}/r10i-receipt.json" data/v4_2/r10i/review_20260928/V4_2_R10I_VERIFICATION_RECEIPT.json
          git diff --exit-code
      - name: Verify documentary excerpts
        run: |
          python - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          from lxml import html
          registry = json.loads(Path('data/v4_2/r10i/review_20260928/V4_2_R10I_CASH_REVIEW.json').read_text())
          base = Path(os.environ['RUNNER_TEMP']) / 'r10i-source-archive/_temp/r10e_primary_sources'
          reviews = registry['narrative_reviews']
          assert len(reviews) == 10
          for item in reviews:
              name = item['source_file']
              assert Path(name).name == name
              raw = (base / name).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == item['source_sha256']
              text = ' '.join(' '.join(html.fromstring(raw).itertext()).split())
              excerpt = item['excerpt']
              start = item['excerpt_start']
              assert excerpt and start >= 0
              assert text[start:start + len(excerpt)] == excerpt
              assert hashlib.sha256(excerpt.encode()).hexdigest() == item['excerpt_sha256']
          print('10 cashflow statement excerpts verified; semantic judgments are not automated.')
          PYCODE
      - name: Validate review dispositions
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          r = json.loads(Path('data/v4_2/r10i/review_20260928/V4_2_R10I_CASH_REVIEW.json').read_text())
          cases = r['case_dispositions']
          assert len(cases) == 10 and len({c['ticker'] for c in cases}) == 10
          assert len(r['items']) == 40
          for c in cases:
              assert c['normalized_owner_earnings_usd'] is None
              assert c['normalization_complete'] is False
              assert c['buy_add_allowed'] is False and c['case_closed'] is False
              assert c['disposition'] == 'INVESTIGARE'
              assert c['confidence'] == 'PROVISIONAL'
              assert c['cash_gate'] == 'RECONCILE_CASH_QUALITY'
          assert r['system_live'] is False and r['engine_modified'] is False
          assert r['ranking_recomputed'] is False and r['case_closures'] == 0
          print('10 explicit unresolved dispositions verified; R11/R12 not run.')
          PYCODE
      - name: Summary
        run: |
          echo '## R10I cash-source and disposition checks passed' >> "$GITHUB_STEP_SUMMARY"
          echo '30 cash inputs and 10 OE arithmetic calculations verified against pinned primary sources.' >> "$GITHUB_STEP_SUMMARY"
          echo '10 complete cashflow statement excerpts and 8 synthetic integrity tests verified.' >> "$GITHUB_STEP_SUMMARY"
          echo '10 INVESTIGARE dispositions; normalized OE missing; zero case closures; no BUY/ADD.' >> "$GITHUB_STEP_SUMMARY"
          echo 'R11/R12 NOT RUN. Economic review incomplete. System NOT LIVE.' >> "$GITHUB_STEP_SUMMARY"
