name: V4.2 Engine Integration Synthetic

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4-2-engine-integration-synthetic
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen V4.1 engine
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("src/investment_os/v4_1_frozen/v4_scoring.py")
          expected="68f626974592915d6c2a8e6583d6c77b"
          actual=hashlib.md5(p.read_bytes()).hexdigest()
          print("expected", expected)
          print("actual  ", actual)
          if actual != expected:
              raise SystemExit("V4.1 frozen engine mismatch")
          PY

      - name: Syntax check
        run: |
          python -m py_compile \
            src/investment_os/v4_1_frozen/v4_scoring.py \
            src/investment_os/v4_2/v4_scoring.py \
            tests/v4_1_frozen/test_v4.py \
            tests/test_v4_2_engine_integration.py

      - name: Run frozen V4.1 suite
        env:
          PYTHONPATH: src/investment_os/v4_1_frozen
        run: python tests/v4_1_frozen/test_v4.py

      - name: Run V4.2 integration synthetic suite
        run: python tests/test_v4_2_engine_integration.py

      - name: Freeze engine manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          def sha256(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          def md5(p):
              return hashlib.md5(Path(p).read_bytes()).hexdigest()

          engine="src/investment_os/v4_2/v4_scoring.py"
          manifest={
            "schema":"investment_os_v4_2_engine_manifest_v1.0",
            "stage":"ENGINE_SYNTHETIC_FREEZE",
            "frozen":True,
            "system_live":False,
            "real_data_v42_ranking_executed":False,
            "v4_1_engine_md5":"68f626974592915d6c2a8e6583d6c77b",
            "v4_2_engine_md5":md5(engine),
            "v4_2_engine_sha256":sha256(engine),
            "integration_test_sha256":sha256("tests/test_v4_2_engine_integration.py"),
            "marketplace_classifier_sha256":sha256("src/marketplace_classifier_v42.py"),
            "inflection_lane_sha256":sha256("src/inflection_lane_v42.py"),
            "cash_quality_commitments_sha256":sha256("src/cash_quality_commitments_v42.py"),
            "canonical_sha256_not_executed":"d2207e92bbe6cc0ef883db6a54d93ac965b08da487741b4de8e2459ed6282f45",
            "bqs_changed":False,
            "ios_weights_changed":False,
            "growth_policy":"G2_GUARDED_PER_SHARE",
            "dcf_growth_cap":0.12,
            "expected_return_growth_cap":0.15,
            "deep_dive_merge":"7 Lane V + 3 Lane I, deterministic dedupe/backfill",
            "next_gate":"R10_HISTORICAL_V41_COMPARISON"
          }
          Path("docs/V4_2_ENGINE_MANIFEST.json").write_text(
              json.dumps(manifest,indent=2)+"\n",encoding="utf-8"
          )
          print(json.dumps(manifest,indent=2))
          PY

      - name: Commit engine manifest
        run: |
          git config user.name "investment-os-data-bridge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/V4_2_ENGINE_MANIFEST.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 1
          fi
          git commit -m "freeze: V4.2 synthetic engine manifest"
          git push

      - name: Summary
        run: |
          echo "V4.2 synthetic engine integration PASS."
          echo "No V4.2 real-data ranking executed."
          echo "System remains NOT LIVE."
