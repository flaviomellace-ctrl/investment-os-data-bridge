name: V4.2 R10A Missingness Reconciliation
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v4-2-r10a-missingness-reconciliation
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile src/r10a_missingness_reconciliation.py
      - name: Run R10A
        run: python src/r10a_missingness_reconciliation.py
      - name: Commit immutable R10A evidence
        run: |
          git config user.name "investment-os-data-bridge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT="data/v4_2/r10a/${GITHUB_RUN_ID}"
          test -f "${OUT}/V4_2_R10A_RECEIPT.json"
          git add "${OUT}"
          if git diff --cached --quiet; then exit 1; fi
          git commit -m "v4.2: freeze R10A missingness reconciliation ${GITHUB_RUN_ID}"
          git push
      - name: Summary
        run: |
          echo "R10A frozen. No engine change. No ranking recomputation."
          echo "System remains NOT LIVE."
