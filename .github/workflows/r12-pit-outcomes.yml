name: R12 PIT outcomes (research only)

on:
  push:
    branches: ["claude/r12-pit-replay"]
    paths: ["pit/outcomes_trigger.json"]

permissions:
  contents: write

concurrency:
  group: r12-pit-replay
  cancel-in-progress: false

jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas requests
      - name: 24-month outcomes
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python src/pit_outcomes.py
      - name: Commit
        if: always()
        run: |
          git config user.name "investment-os-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pit/out/outcomes_24m.json || true
          git commit -m "R12 outcomes 24m ($GITHUB_RUN_ID)" || exit 0
          git pull --rebase -q origin claude/r12-pit-replay && git push
