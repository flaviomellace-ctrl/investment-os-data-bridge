name: Economic gate regression
on:
  push:
    branches: [research/br04-data09-current-base]
  pull_request:
permissions:
  contents: read
jobs:
  economic-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_br04_economic_gate.py
