name: V4.1 Blind Discovery Quantitative Freeze

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4-1-blind-discovery-quant-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EXPECTED_CANONICAL_SHA256: "d2207e92bbe6cc0ef883db6a54d93ac965b08da487741b4de8e2459ed6282f45"
      EXPECTED_ENGINE_MD5: "68f626974592915d6c2a8e6583d6c77b"
      V4_SCORING_B64: ""
      TEST_V4_B64: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore frozen V4.1 engine and regression suite
        shell: bash
        run: |
          mkdir -p .blind_runtime
          printf '%s' "$V4_SCORING_B64" | base64 -d > .blind_runtime/v4_scoring.py
          printf '%s' "$TEST_V4_B64" | base64 -d > .blind_runtime/test_v4.py
          ACTUAL_MD5="$(md5sum .blind_runtime/v4_scoring.py | awk '{print $1}')"
          echo "Frozen engine MD5: $ACTUAL_MD5"
          test "$ACTUAL_MD5" = "$EXPECTED_ENGINE_MD5"

      - name: Run frozen V4.1 regression suite
        shell: bash
        run: |
          cd .blind_runtime
          python test_v4.py

      - name: Quantitative discovery and immutable candidate freeze
        shell: bash
        run: |
          cat > .blind_runtime/run_quant_freeze.py <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import math
          import os
          import re
          import subprocess
          import sys
          import urllib.parse
          import urllib.request
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          CURRENT = ROOT / "data" / "current"
          CSV_PATH = CURRENT / "sp500_fundamentals.csv"
          INDEX_PATH = CURRENT / "fundamentals_chunks.json"
          ENGINE_DIR = ROOT / ".blind_runtime"
          ENGINE_PATH = ENGINE_DIR / "v4_scoring.py"
          TEST_PATH = ENGINE_DIR / "test_v4.py"

          EXPECTED_CANONICAL_SHA = os.environ["EXPECTED_CANONICAL_SHA256"].strip()
          EXPECTED_ENGINE_MD5 = os.environ["EXPECTED_ENGINE_MD5"].strip()
          RUN_ID = os.environ["GITHUB_RUN_ID"].strip()
          WORKFLOW_SHA = os.environ["GITHUB_SHA"].strip()
          REPO = os.environ["GITHUB_REPOSITORY"].strip()

          OUT = ROOT / "data" / "blind_v4_1" / RUN_ID / "quantitative"
          OUT.mkdir(parents=True, exist_ok=False)

          NASDAQ_URL = "https://api.nasdaq.com/api/screener/stocks"
          NASDAQ_HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/120.0 Safari/537.36"
              ),
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Referer": "https://www.nasdaq.com/",
          }
          MIN_MARKET_COVERAGE_PCT = 98.0
          EXPECTED_ROWS = 504
          EXPECTED_COLUMNS = 285

          def utcnow() -> str:
              return datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          def md5_file(path: Path) -> str:
              h = hashlib.md5()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          def load_json(path: Path) -> dict:
              return json.loads(path.read_text(encoding="utf-8"))

          def num(v):
              if v in (None, "", "nan", "NaN", "None", "MISSING", "NA"):
                  return None
              if isinstance(v, str) and v.strip() in ("", "MISSING", "NA"):
                  return None
              try:
                  x = float(v)
              except (TypeError, ValueError):
                  return None
              return x if math.isfinite(x) else None

          def boolish(v) -> bool:
              if isinstance(v, bool):
                  return v
              return str(v).strip().lower() in ("1", "true", "yes", "y")

          def clean_symbol(value) -> str:
              return str(value or "").strip().upper().replace("/", ".")

          def symbol_variants(symbol: str) -> list[str]:
              out = [symbol]
              if "." in symbol:
                  out.append(symbol.replace(".", "-"))
              if "-" in symbol:
                  out.append(symbol.replace("-", "."))
              return list(dict.fromkeys(out))

          def finite_positive(value):
              if value is None:
                  return None
              text = str(value).strip().replace("$", "").replace(",", "")
              if not text:
                  return None
              try:
                  x = float(text)
              except (TypeError, ValueError):
                  return None
              if not math.isfinite(x) or x <= 0:
                  return None
              return x

          def csv_records_raw(data: bytes) -> list[bytes]:
              if not data:
                  return []
              records = []
              start = 0
              i = 0
              in_quotes = False
              while i < len(data):
                  b = data[i]
                  if b == 0x22:
                      if in_quotes and i + 1 < len(data) and data[i + 1] == 0x22:
                          i += 2
                          continue
                      in_quotes = not in_quotes
                      i += 1
                      continue
                  if b == 0x0A and not in_quotes:
                      records.append(data[start:i+1])
                      start = i + 1
                  i += 1
              if in_quotes:
                  raise RuntimeError("CSV canonicale non valido: campo quoted non chiuso")
              if start < len(data):
                  records.append(data[start:])
              return records

          def verify_t20() -> dict:
              source = CSV_PATH.read_bytes()
              index = load_json(INDEX_PATH)
              records = csv_records_raw(source)
              if not records:
                  raise RuntimeError("CSV canonicale vuoto")
              header = records[0]

              out = bytearray()
              rows_sum = 0
              expected_start = 1
              part_hash_failures = 0
              parts = index.get("parts", [])
              hard_max = int(index.get("hard_max_bytes", 0))

              for i, meta in enumerate(parts):
                  part = CURRENT / meta["filename"]
                  if not part.exists():
                      raise RuntimeError(f"Chunk mancante: {meta['filename']}")
                  raw = part.read_bytes()
                  if sha256_bytes(raw) != meta.get("sha256"):
                      part_hash_failures += 1
                  if hard_max <= 0 or len(raw) > hard_max:
                      raise RuntimeError(f"Chunk oltre hard max: {meta['filename']}")
                  if not raw.startswith(header):
                      raise RuntimeError(f"Header chunk non coerente: {meta['filename']}")

                  rows = int(meta.get("rows", 0))
                  start = int(meta.get("row_start_1_based", 0))
                  end = int(meta.get("row_end_1_based", 0))
                  if start != expected_start or end != start + rows - 1:
                      raise RuntimeError(f"Range non contiguo: {meta['filename']}")
                  expected_start = end + 1
                  rows_sum += rows

                  if i == 0:
                      out.extend(raw)
                  else:
                      out.extend(raw[len(header):])

              reassembled = bytes(out)
              result = {
                  "source_sha256": sha256_bytes(source),
                  "index_source_sha256": index.get("source_sha256"),
                  "parts_declared": int(index.get("total_parts", 0)),
                  "parts_read": len(parts),
                  "part_sha256_failures": part_hash_failures,
                  "rows_declared": int(index.get("total_rows", 0)),
                  "rows_from_parts": rows_sum,
                  "ranges_contiguous": expected_start - 1 == rows_sum,
                  "reassembled_byte_identical": reassembled == source,
                  "reassembled_sha256": sha256_bytes(reassembled),
              }
              result["passed"] = all([
                  result["source_sha256"] == EXPECTED_CANONICAL_SHA,
                  result["index_source_sha256"] == EXPECTED_CANONICAL_SHA,
                  result["parts_declared"] == result["parts_read"],
                  result["part_sha256_failures"] == 0,
                  result["rows_declared"] == result["rows_from_parts"] == len(records) - 1,
                  result["ranges_contiguous"],
                  result["reassembled_byte_identical"],
                  result["reassembled_sha256"] == EXPECTED_CANONICAL_SHA,
              ])
              return result

          def fetch_nasdaq_market(retrieved_at: str) -> tuple[dict[str, dict], dict]:
              params = urllib.parse.urlencode({
                  "tableonly": "true",
                  "limit": "10000",
                  "offset": "0",
                  "download": "true",
              })
              req = urllib.request.Request(
                  NASDAQ_URL + "?" + params,
                  headers=NASDAQ_HEADERS,
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      status = response.status
                      body = response.read()
              except Exception as exc:
                  raise RuntimeError(f"Nasdaq market snapshot non disponibile: {type(exc).__name__}: {exc}")

              if status != 200:
                  raise RuntimeError(f"Nasdaq market snapshot HTTP {status}")

              payload = json.loads(body.decode("utf-8"))
              rows = ((payload or {}).get("data") or {}).get("rows") or []
              market = {}
              for row in rows:
                  symbol = clean_symbol(row.get("symbol"))
                  if not symbol:
                      continue
                  price = finite_positive(
                      row.get("lastsale")
                      if row.get("lastsale") is not None
                      else row.get("lastSalePrice")
                  )
                  market_cap = finite_positive(row.get("marketCap"))
                  market[symbol] = {
                      "market_price": price,
                      "market_cap": market_cap,
                      "market_data_source": "NASDAQ_PUBLIC_SCREENER",
                      "market_data_source_symbol": symbol,
                      "market_data_retrieved_at_utc": retrieved_at,
                      "market_data_as_of_status": "RETRIEVAL_TIME_ONLY",
                  }
              return market, {
                  "source": "NASDAQ_PUBLIC_SCREENER",
                  "url": NASDAQ_URL,
                  "http_status": status,
                  "rows_returned": len(rows),
                  "retrieved_at_utc": retrieved_at,
                  "as_of_status": "RETRIEVAL_TIME_ONLY",
                  "market_cap_reconstructed_from_bridge_shares": False,
              }

          def module_of(sic):
              if sic is None:
                  return "UNKNOWN"
              try:
                  s = int(float(sic))
              except (TypeError, ValueError):
                  return "UNKNOWN"
              if s in (6021,6022,6020,6035,6036,6199,6141,6159,6162,6172): return "BANK"
              if s in (6311,6321,6324,6331,6399,6411,6300,6351): return "INSURANCE"
              if s in (6798,6510,6500,6512,6792,6552,6531): return "REIT"
              if 4900 <= s <= 4991: return "UTILITY"
              if s in (6211,6282,6200,6221): return "ASSETMGR_EXCH"
              if s in (1311,1389,2911,1000,1040,1400,1220,2870,3533): return "RESOURCES"
              if s in (3674,3559,3827,3825,3576,3572,3571,3577,3661,3663,3670,3672): return "SEMICONDUCTOR"
              if s in (7372,7370,7371,7373,7374,7389,7379): return "SOFTWARE"
              if 3400 <= s <= 3569 or 3580 <= s <= 3600 or s in (3711,3714,3721,3728,3812,8711,1731):
                  return "INDUSTRIAL"
              return "GENERAL"

          def yoy(current, prior):
              c, p = num(current), num(prior)
              if c is None or p in (None, 0):
                  return None
              return c / p - 1.0

          def br04_value(row, key, NA, CONFLICTING):
              raw = str(row.get(key) or "").strip()
              if raw == "":
                  return None
              if raw == "NOT_APPLICABLE":
                  return NA
              if raw == "CONFLICTING":
                  return CONFLICTING
              return num(raw)

          def derive(row, market_row, NA, CONFLICTING):
              g = lambda k: num(row.get(k))
              rev = g("annual_revenue")
              ni = g("annual_net_income")
              ocf = g("annual_operating_cash_flow")
              capex = g("annual_capex")
              eq = g("annual_equity")
              assets = g("annual_assets")

              c = {}
              c["module"] = module_of(g("sic"))
              c["data_coverage_pct"] = g("core_metric_coverage_pct")
              c["op_margin"] = g("operating_margin")
              c["fcf_margin"] = g("fcf_margin")
              c["net_margin"] = g("net_margin")
              c["roe"] = g("roe_simple")
              c["roic"] = br04_value(row, "roic", NA, CONFLICTING)
              c["cash_conversion"] = (ocf / ni) if (ocf is not None and ni not in (None, 0)) else None
              c["accrual_quality"] = c["cash_conversion"]
              c["equity_to_assets"] = (eq / assets) if (eq is not None and assets not in (None, 0)) else None
              c["net_debt_to_ocf"] = br04_value(row, "net_debt_to_ocf", NA, CONFLICTING)
              c["interest_coverage"] = br04_value(row, "interest_coverage", NA, CONFLICTING)
              c["reinvestment_rate"] = (capex / rev) if (capex is not None and rev not in (None, 0)) else None

              c["share_change"] = g("share_change")
              if c["share_change"] is None:
                  c["share_change"] = g("diluted_shares_yoy")

              c["ni_yoy"] = g("net_income_yoy")
              c["opinc_yoy"] = yoy(row.get("annual_operating_income"), row.get("prior_operating_income"))
              c["net_income_series"] = [
                  g("fy_minus_3_net_income"),
                  g("fy_minus_2_net_income"),
                  g("fy_minus_1_net_income"),
                  g("annual_net_income"),
              ]

              c["book_value"] = eq
              c["ocf"] = ocf
              c["capex"] = capex

              c["revenue_cagr3"] = g("revenue_cagr3")
              c["opinc_cagr3"] = g("opinc_cagr3")
              c["fcf_cagr3"] = g("fcf_cagr3")
              c["fcf_per_share_cagr3"] = g("fcf_per_share_cagr3")
              c["margin_stability"] = g("operating_margin_std_4y")

              c["sbc"] = g("annual_sbc")
              c["sbc_to_revenue"] = g("sbc_to_revenue")

              c["market_cap"] = market_row.get("market_cap") if market_row else None
              c["price"] = market_row.get("market_price") if market_row else None
              c["market_data_source"] = market_row.get("market_data_source") if market_row else None
              c["market_data_as_of"] = market_row.get("market_data_retrieved_at_utc") if market_row else None
              c["market_data_status"] = "PRESENT" if market_row else "MISSING"

              ba = str(row.get("buyback_accretion") or "").strip()
              c["buyback_accretion"] = NA if ba == "NOT_APPLICABLE" else g("buyback_accretion")
              c["payout_ratio"] = g("payout_ratio")

              # Known post-minimum-bridge gaps remain MISSING by design.
              for k in (
                  "retention","unit_cost_decline","two_sided_growth","frequency_growth",
                  "combined_ratio","ffo_margin","occupancy",
                  "ebitda_on_volume","fcf_on_volume","take_rate","affo"
              ):
                  c[k] = None

              return c

          def normalize_market_for_ticker(ticker, market):
              for candidate in symbol_variants(ticker):
                  rec = market.get(candidate)
                  if rec and rec.get("market_price") is not None and rec.get("market_cap") is not None:
                      out = dict(rec)
                      out["matched_symbol"] = candidate
                      return out
              return None

          def write_csv(path: Path, rows: list[dict], fields: list[str]):
              with path.open("w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=fields, extrasaction="ignore")
                  w.writeheader()
                  w.writerows(rows)

          # --------------------------------------------------------------------------
          # A. Integrity checks. No ranking output is written if any of these fail.
          # --------------------------------------------------------------------------
          if not CSV_PATH.exists() or not INDEX_PATH.exists():
              raise SystemExit("Canonical data/current incomplete")

          canonical_sha = sha256_file(CSV_PATH)
          if canonical_sha != EXPECTED_CANONICAL_SHA:
              raise SystemExit(
                  f"Canonical SHA changed: {canonical_sha} != {EXPECTED_CANONICAL_SHA}. "
                  "Blind discovery not started."
              )

          if md5_file(ENGINE_PATH) != EXPECTED_ENGINE_MD5:
              raise SystemExit("Frozen V4.1 engine MD5 mismatch")

          s7 = load_json(
              ROOT / "data" / "staging" / "br04" / "35977079536"
              / "evidence" / "br04_s7_post_promotion.json"
          )
          if s7.get("result") != "PASS" or s7.get("br04_closed") is not True:
              raise SystemExit("BR-04 S7 PASS evidence missing")

          meta_finalize = load_json(
              ROOT / "data" / "staging" / "br04" / "35977079536"
              / "evidence" / "br04_s7_metadata_finalize.json"
          )
          if meta_finalize.get("overall_passed") is not True:
              raise SystemExit("BR-04 metadata finalization PASS evidence missing")

          t20 = verify_t20()
          if not t20["passed"]:
              raise SystemExit("Canonical T20 failed before Blind Discovery")

          with CSV_PATH.open(newline="", encoding="utf-8") as f:
              raw_rows = list(csv.DictReader(f))
              fieldnames = list(f.fieldnames or [])

          if len(raw_rows) != EXPECTED_ROWS:
              raise SystemExit(f"Unexpected universe size: {len(raw_rows)} != {EXPECTED_ROWS}")
          if len(fieldnames) != EXPECTED_COLUMNS:
              raise SystemExit(f"Unexpected canonical columns: {len(fieldnames)} != {EXPECTED_COLUMNS}")
          if len({r.get("ticker") for r in raw_rows}) != len(raw_rows):
              raise SystemExit("Duplicate ticker in canonical universe")

          # --------------------------------------------------------------------------
          # B. Fresh market snapshot. It never writes to data/current.
          # --------------------------------------------------------------------------
          retrieved_at = utcnow()
          market, market_meta = fetch_nasdaq_market(retrieved_at)

          market_rows = []
          market_map = {}
          for row in raw_rows:
              ticker = clean_symbol(row.get("ticker"))
              rec = normalize_market_for_ticker(ticker, market)
              if rec:
                  market_map[ticker] = rec
                  market_rows.append({
                      "ticker": ticker,
                      "name": row.get("name") or "",
                      "market_price": rec["market_price"],
                      "market_cap": rec["market_cap"],
                      "source": rec["market_data_source"],
                      "source_symbol": rec["matched_symbol"],
                      "retrieved_at_utc": rec["market_data_retrieved_at_utc"],
                      "as_of_status": rec["market_data_as_of_status"],
                  })
              else:
                  market_rows.append({
                      "ticker": ticker,
                      "name": row.get("name") or "",
                      "market_price": "",
                      "market_cap": "",
                      "source": "MISSING",
                      "source_symbol": "",
                      "retrieved_at_utc": retrieved_at,
                      "as_of_status": "MISSING",
                  })

          market_present = sum(1 for r in market_rows if r["market_price"] != "" and r["market_cap"] != "")
          market_coverage_pct = round(market_present / len(raw_rows) * 100, 1)
          market_meta["universe_rows"] = len(raw_rows)
          market_meta["complete_price_and_market_cap"] = market_present
          market_meta["coverage_pct"] = market_coverage_pct
          market_meta["minimum_required_coverage_pct"] = MIN_MARKET_COVERAGE_PCT

          if market_coverage_pct < MIN_MARKET_COVERAGE_PCT:
              raise SystemExit(
                  f"Fresh market coverage {market_coverage_pct}% < {MIN_MARKET_COVERAGE_PCT}%. "
                  "No quantitative freeze produced."
              )

          # --------------------------------------------------------------------------
          # C. Load frozen engine and score the entire universe.
          # --------------------------------------------------------------------------
          sys.path.insert(0, str(ENGINE_DIR))
          from v4_scoring import (
              NA, CONFLICTING, IOS_GATE, bqs, bqs_confidence, ios, ios_variant
          )

          scored = []
          bqs_exceptions = []
          ios_exceptions = []

          for row in raw_rows:
              ticker = clean_symbol(row.get("ticker"))
              market_row = market_map.get(ticker)
              c = derive(row, market_row, NA, CONFLICTING)

              try:
                  bqs_score, bqs_cov, detail, growth_flags = bqs(c)
              except Exception as exc:
                  bqs_exceptions.append({
                      "ticker": ticker,
                      "type": type(exc).__name__,
                      "message": str(exc),
                  })
                  continue

              metric_cov = num(detail.get("_metric_coverage_pct")) or 0.0
              provisional_components = detail.get("_provisional_components", []) or []
              data_cov = num(row.get("core_metric_coverage_pct")) or 0.0
              data_status = str(row.get("data_status") or "").strip()

              confidence = bqs_confidence(
                  bqs_cov,
                  data_cov,
                  data_status,
                  metric_cov,
                  provisional_components,
              )

              bqs_eligible = (
                  bqs_score is not None
                  and data_cov >= 70.0
                  and data_status == "PRESENT"
              )

              ios_score = None
              ios_detail = {}
              ios_gate_reason = ""
              if bqs_score is not None:
                  try:
                      ios_score, ios_detail = ios(c, bqs_score, bqs_cov)
                      if ios_score is None:
                          ios_gate_reason = str(ios_detail.get("gate") or "")
                  except Exception as exc:
                      ios_exceptions.append({
                          "ticker": ticker,
                          "type": type(exc).__name__,
                          "message": str(exc),
                      })
                      continue

              lev_ind = boolish(row.get("ios_leverage_indeterminate"))
              ios_provisional_reasons = []
              if ios_score is not None and confidence == "PROVISIONAL":
                  ios_provisional_reasons.append("BQS_PROVISIONAL")
              if ios_score is not None and lev_ind:
                  ios_provisional_reasons.append("LEVERAGE_THRESHOLD_INDETERMINATE")

              if ios_score is None:
                  ios_conf = "NOT_CALCULATED"
              elif ios_provisional_reasons:
                  ios_conf = "PROVISIONAL"
              else:
                  ios_conf = "CALCULATED"

              record = {
                  "ticker": ticker,
                  "name": row.get("name") or "",
                  "module": c.get("module") or "",
                  "data_status": data_status,
                  "data_coverage_pct": round(data_cov, 1),
                  "bqs": bqs_score if bqs_score is not None else "",
                  "bqs_coverage_pct": bqs_cov if bqs_score is not None else "",
                  "metric_coverage_pct": round(metric_cov, 1),
                  "bqs_confidence": confidence if bqs_score is not None else "NOT_CALCULATED",
                  "bqs_provisional_components": "|".join(provisional_components),
                  "growth_flags": "|".join(growth_flags or []),
                  "bqs_eligible_top30": bqs_eligible,
                  "bqs_rank": "",
                  "market_price": market_row.get("market_price") if market_row else "",
                  "market_cap": market_row.get("market_cap") if market_row else "",
                  "market_source": market_row.get("market_data_source") if market_row else "MISSING",
                  "market_source_symbol": market_row.get("matched_symbol") if market_row else "",
                  "market_retrieved_at_utc": market_row.get("market_data_retrieved_at_utc") if market_row else retrieved_at,
                  "ios": ios_score if ios_score is not None else "",
                  "ios_variant": ios_detail.get("variant") if ios_score is not None else ios_variant(c.get("module") if c.get("module") != "UNKNOWN" else "GENERAL"),
                  "ios_rank": "",
                  "ios_confidence": ios_conf,
                  "ios_provisional_reasons": "|".join(ios_provisional_reasons),
                  "ios_leverage_indeterminate": lev_ind,
                  "ios_gate_reason": ios_gate_reason,
                  "discount_rate": ios_detail.get("r", "") if ios_score is not None else "",
                  "owner_yield": ios_detail.get("owner_yield", "") if ios_score is not None else "",
                  "expected_return": ios_detail.get("exp_ret", "") if ios_score is not None else "",
                  "margin_of_safety": ios_detail.get("mos", "") if ios_score is not None else "",
                  "bear_return": ios_detail.get("bear", "") if ios_score is not None else "",
                  "bull_return": ios_detail.get("bull", "") if ios_score is not None else "",
              }
              scored.append(record)

          if bqs_exceptions or ios_exceptions:
              raise SystemExit(
                  "Frozen engine raised exceptions on real data. "
                  f"BQS={len(bqs_exceptions)} IOS={len(ios_exceptions)}. "
                  "No ranking frozen."
              )

          if len(scored) != len(raw_rows):
              raise SystemExit("Not all canonical rows were scored")

          # --------------------------------------------------------------------------
          # D. Pre-registered deterministic ranking rules.
          # No human/model discretion enters the candidate selection.
          # --------------------------------------------------------------------------
          bqs_pool = [r for r in scored if r["bqs_eligible_top30"] and r["bqs"] != ""]
          bqs_pool.sort(
              key=lambda r: (
                  -float(r["bqs"]),
                  -float(r["metric_coverage_pct"]),
                  -float(r["data_coverage_pct"]),
                  r["ticker"],
              )
          )
          for i, r in enumerate(bqs_pool, 1):
              r["bqs_rank"] = i

          ios_pool = [r for r in scored if r["ios"] != ""]
          ios_pool.sort(
              key=lambda r: (
                  -float(r["ios"]),
                  -float(r["bqs"]),
                  r["ticker"],
              )
          )
          for i, r in enumerate(ios_pool, 1):
              r["ios_rank"] = i

          top30_bqs = [dict(r) for r in bqs_pool[:30]]
          top20_ios = [dict(r) for r in ios_pool[:20]]

          # Max 10 deep dives: deterministically first 10 of frozen IOS ranking.
          deep_dive_queue = [dict(r) for r in ios_pool[:10]]
          for i, r in enumerate(deep_dive_queue, 1):
              r["deep_dive_queue_rank"] = i
              r["deep_dive_selection_rule"] = "TOP10_IOS_DESC__BQS_DESC__TICKER_ASC"

          # --------------------------------------------------------------------------
          # E. Write immutable quantitative freeze package.
          # --------------------------------------------------------------------------
          fields = [
              "ticker","name","module","data_status","data_coverage_pct",
              "bqs","bqs_coverage_pct","metric_coverage_pct","bqs_confidence",
              "bqs_provisional_components","growth_flags","bqs_eligible_top30","bqs_rank",
              "market_price","market_cap","market_source","market_source_symbol",
              "market_retrieved_at_utc",
              "ios","ios_variant","ios_rank","ios_confidence","ios_provisional_reasons",
              "ios_leverage_indeterminate","ios_gate_reason","discount_rate","owner_yield",
              "expected_return","margin_of_safety","bear_return","bull_return",
          ]

          write_csv(OUT / "V4_1_RANKING_FULL.csv", sorted(scored, key=lambda r: r["ticker"]), fields)
          write_csv(OUT / "V4_1_TOP30_BQS.csv", top30_bqs, fields)
          write_csv(OUT / "V4_1_TOP20_IOS.csv", top20_ios, fields)
          write_csv(
              OUT / "V4_1_DEEP_DIVE_QUEUE.csv",
              deep_dive_queue,
              fields + ["deep_dive_queue_rank","deep_dive_selection_rule"],
          )
          write_csv(
              OUT / "V4_1_MARKET_SNAPSHOT.csv",
              sorted(market_rows, key=lambda r: r["ticker"]),
              [
                  "ticker","name","market_price","market_cap","source","source_symbol",
                  "retrieved_at_utc","as_of_status"
              ],
          )

          confidence_counts = Counter(r["bqs_confidence"] for r in scored)
          module_counts = Counter(r["module"] for r in scored)
          ios_conf_counts = Counter(r["ios_confidence"] for r in scored)
          leverage_indeterminate_ios = sum(
              1 for r in scored if r["ios"] != "" and r["ios_leverage_indeterminate"]
          )

          freeze_time = utcnow()

          md = [
              "# Investment OS V4.1 — Blind Discovery Quantitative Freeze",
              "",
              "**QUANTITATIVE CANDIDATE SET FROZEN — DO NOT MODIFY**",
              "",
              f"- Frozen at UTC: **{freeze_time}**",
              f"- GitHub Actions run: **{RUN_ID}**",
              f"- Workflow commit SHA: `{WORKFLOW_SHA}`",
              f"- Canonical fundamentals SHA-256: `{canonical_sha}`",
              f"- Frozen V4.1 engine MD5: `{md5_file(ENGINE_PATH)}`",
              f"- Universe: **{len(scored)}** companies",
              f"- Canonical columns: **{len(fieldnames)}**",
              f"- Fresh market snapshot coverage: **{market_coverage_pct:.1f}%** ({market_present}/{len(scored)})",
              "- Market-cap rule: **direct Nasdaq value only; never reconstructed from bridge share count**",
              "- Validation material used by this workflow: **NO**",
              "- Final Blind Test frozen: **NO — quantitative queue only; deep dives still pending**",
              "- System status: **NOT LIVE**",
              "",
              "## Pre-registered deterministic rules",
              "",
              "1. BQS is computed before price/market cap is used.",
              "2. Top-30 BQS eligibility: numeric BQS + `data_status=PRESENT` + bridge core data coverage >=70%.",
              "3. Top-30 ordering: BQS descending, metric coverage descending, data coverage descending, ticker ascending.",
              "4. IOS is attempted for every company allowed by the frozen V4.1 engine gate (BQS>=60 and bridge data coverage>=70), not only Top-30 BQS.",
              "5. Top-20 IOS ordering: IOS descending, BQS descending, ticker ascending.",
              "6. Deep-dive queue: first 10 names of that frozen IOS ordering. No discretionary substitution.",
              "7. Every IOS with `ios_leverage_indeterminate=true` is labelled **PROVISIONAL** and cannot reach a trade Decision Gate without manual debt reconciliation.",
              "8. BQS `PROVISIONAL` confidence is preserved; it is never silently upgraded.",
              "9. Missing sector-specific data remain MISSING; no value is imputed as zero.",
              "",
              "## Aggregate diagnostics",
              "",
              f"- BQS Top-30 eligible pool: **{len(bqs_pool)}**",
              f"- IOS numeric pool: **{len(ios_pool)}**",
              f"- IOS with indeterminate leverage: **{leverage_indeterminate_ios}**",
              f"- BQS confidence counts: `{json.dumps(dict(sorted(confidence_counts.items())), sort_keys=True)}`",
              f"- IOS confidence counts: `{json.dumps(dict(sorted(ios_conf_counts.items())), sort_keys=True)}`",
              f"- Module counts: `{json.dumps(dict(sorted(module_counts.items())), sort_keys=True)}`",
              "",
              "## Frozen Top 30 BQS",
              "",
              "| Rank | Ticker | Name | BQS | Confidence | Metric cov. |",
              "|---:|---|---|---:|---|---:|",
          ]
          for r in top30_bqs:
              md.append(
                  f"| {r['bqs_rank']} | {r['ticker']} | {str(r['name']).replace('|','/')} | "
                  f"{r['bqs']} | {r['bqs_confidence']} | {r['metric_coverage_pct']}% |"
              )

          md += [
              "",
              "## Frozen Top 20 IOS",
              "",
              "| Rank | Ticker | Name | IOS | BQS | IOS confidence |",
              "|---:|---|---|---:|---:|---|",
          ]
          for r in top20_ios:
              md.append(
                  f"| {r['ios_rank']} | {r['ticker']} | {str(r['name']).replace('|','/')} | "
                  f"{r['ios']} | {r['bqs']} | {r['ios_confidence']} |"
              )

          md += [
              "",
              "## Frozen Deep-Dive Queue (max 10)",
              "",
              "| Queue | Ticker | Name | IOS | BQS | Caveat |",
              "|---:|---|---|---:|---:|---|",
          ]
          for r in deep_dive_queue:
              caveat = r["ios_provisional_reasons"] or r["bqs_confidence"]
              md.append(
                  f"| {r['deep_dive_queue_rank']} | {r['ticker']} | {str(r['name']).replace('|','/')} | "
                  f"{r['ios']} | {r['bqs']} | {caveat} |"
              )

          md += [
              "",
              "## Stop condition",
              "",
              "This package freezes only the quantitative discovery and the deep-dive queue.",
              "Do not open or use any validation set yet.",
              "The next stage may research only the companies in `V4_1_DEEP_DIVE_QUEUE.csv`, using a uniform template.",
              "After those deep dives and any required independent Decision Gates are finished, the final Blind Discovery result must be frozen before validation.",
              "",
          ]
          (OUT / "BLIND_DISCOVERY_V4_1_QUANT_FREEZE.md").write_text("\n".join(md), encoding="utf-8")

          # File hashes are frozen into a receipt after all substantive outputs exist.
          output_names = [
              "V4_1_RANKING_FULL.csv",
              "V4_1_TOP30_BQS.csv",
              "V4_1_TOP20_IOS.csv",
              "V4_1_DEEP_DIVE_QUEUE.csv",
              "V4_1_MARKET_SNAPSHOT.csv",
              "BLIND_DISCOVERY_V4_1_QUANT_FREEZE.md",
          ]
          output_hashes = {
              name: {
                  "sha256": sha256_file(OUT / name),
                  "bytes": (OUT / name).stat().st_size,
              }
              for name in output_names
          }

          receipt = {
              "schema": "blind_discovery_v4_1_quant_freeze_v1.0",
              "stage": "QUANTITATIVE_FREEZE",
              "frozen": True,
              "final_blind_test_frozen": False,
              "frozen_at_utc": freeze_time,
              "github_run_id": RUN_ID,
              "workflow_commit_sha": WORKFLOW_SHA,
              "canonical_sha256": canonical_sha,
              "engine_md5": md5_file(ENGINE_PATH),
              "engine_regression_suite_passed": True,
              "canonical_t20": t20,
              "universe_rows": len(scored),
              "canonical_columns": len(fieldnames),
              "market_snapshot": market_meta,
              "rules": {
                  "bqs_before_price": True,
                  "top30_bqs_eligibility": "numeric BQS AND data_status=PRESENT AND core_data_coverage>=70",
                  "top30_bqs_order": "BQS DESC, metric_coverage DESC, data_coverage DESC, ticker ASC",
                  "ios_gate": "frozen engine: BQS>=60 AND core_data_coverage>=70",
                  "ios_scope": "all gate-eligible companies, not only BQS Top30",
                  "top20_ios_order": "IOS DESC, BQS DESC, ticker ASC",
                  "deep_dive_queue": "first 10 of frozen IOS order",
                  "leverage_indeterminate": "label IOS PROVISIONAL; manual debt reconciliation required before Decision Gate",
                  "missing_is_zero": False,
                  "market_cap_reconstructed_from_bridge_shares": False,
              },
              "validation_material_used_by_workflow": False,
              "selection_is_deterministic": True,
              "top30_count": len(top30_bqs),
              "top20_count": len(top20_ios),
              "deep_dive_queue_count": len(deep_dive_queue),
              "bqs_eligible_pool": len(bqs_pool),
              "ios_numeric_pool": len(ios_pool),
              "bqs_confidence_counts": dict(sorted(confidence_counts.items())),
              "ios_confidence_counts": dict(sorted(ios_conf_counts.items())),
              "module_counts": dict(sorted(module_counts.items())),
              "ios_leverage_indeterminate_count": leverage_indeterminate_ios,
              "bqs_engine_exceptions": 0,
              "ios_engine_exceptions": 0,
              "outputs": output_hashes,
              "system_live": False,
              "blind_test_actionable_ideas_selected": False,
              "validation_open_authorized": False,
          }
          (OUT / "FREEZE_RECEIPT.json").write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          print("V4.1 QUANTITATIVE FREEZE COMPLETE")
          print("output_dir =", OUT.relative_to(ROOT))
          print("canonical_sha256 =", canonical_sha)
          print("engine_md5 =", md5_file(ENGINE_PATH))
          print("market_coverage_pct =", market_coverage_pct)
          print("bqs_pool =", len(bqs_pool))
          print("ios_pool =", len(ios_pool))
          print("deep_dive_queue =", len(deep_dive_queue))
          print("FINAL BLIND TEST FROZEN = NO")
          print("VALIDATION OPEN AUTHORIZED = NO")

          PY
          # Remove heredoc indentation introduced by YAML block nesting.
          sed -i 's/^          //' .blind_runtime/run_quant_freeze.py
          python .blind_runtime/run_quant_freeze.py

      - name: Commit frozen quantitative package
        shell: bash
        run: |
          git config user.name "investment-os-data-bridge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          OUT_DIR="data/blind_v4_1/${GITHUB_RUN_ID}/quantitative"
          test -f "$OUT_DIR/FREEZE_RECEIPT.json"
          test -f "$OUT_DIR/V4_1_DEEP_DIVE_QUEUE.csv"

          git add "$OUT_DIR"

          if git diff --cached --quiet; then
            echo "No Blind Discovery freeze files to commit."
            exit 1
          fi

          git commit -m "blind: freeze V4.1 quantitative discovery ${GITHUB_RUN_ID}"
          git push

      - name: Summary
        run: |
          echo "V4.1 quantitative candidate set frozen."
          echo "Do NOT open validation yet."
          echo "Next: uniform deep dives only on the frozen queue, then final Blind Discovery freeze."
