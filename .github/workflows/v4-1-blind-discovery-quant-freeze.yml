name: V4.1 Blind Discovery Quantitative Freeze

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4-1-blind-discovery-quant-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EXPECTED_CANONICAL_SHA256: "d2207e92bbe6cc0ef883db6a54d93ac965b08da487741b4de8e2459ed6282f45"
      EXPECTED_ENGINE_MD5: "68f626974592915d6c2a8e6583d6c77b"
      V4_SCORING_B64: ""
      TEST_V4_B64: ""
      QUANT_RUNNER_B64: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore frozen V4.1 engine and regression suite
        shell: bash
        run: |
          mkdir -p .blind_runtime
          printf '%s' "$V4_SCORING_B64" | base64 -d > .blind_runtime/v4_scoring.py
          printf '%s' "$TEST_V4_B64" | base64 -d > .blind_runtime/test_v4.py
          ACTUAL_MD5="$(md5sum .blind_runtime/v4_scoring.py | awk '{print $1}')"
          echo "Frozen engine MD5: $ACTUAL_MD5"
          test "$ACTUAL_MD5" = "$EXPECTED_ENGINE_MD5"

      - name: Run frozen V4.1 regression suite
        shell: bash
        run: |
          cd .blind_runtime
          python test_v4.py

      - name: Restore quantitative freeze runner
        shell: bash
        run: |
          printf '%s' "$QUANT_RUNNER_B64" | base64 -d > .blind_runtime/run_quant_freeze.py
          python -m py_compile .blind_runtime/run_quant_freeze.py

      - name: Quantitative discovery and immutable candidate freeze
        shell: bash
        run: |
          python .blind_runtime/run_quant_freeze.py

      - name: Commit frozen quantitative package
        shell: bash
        run: |
          git config user.name "investment-os-data-bridge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          OUT_DIR="data/blind_v4_1/${GITHUB_RUN_ID}/quantitative"
          test -f "$OUT_DIR/FREEZE_RECEIPT.json"
          test -f "$OUT_DIR/V4_1_DEEP_DIVE_QUEUE.csv"

          git add "$OUT_DIR"

          if git diff --cached --quiet; then
            echo "No Blind Discovery freeze files to commit."
            exit 1
          fi

          git commit -m "blind: freeze V4.1 quantitative discovery ${GITHUB_RUN_ID}"
          git push

      - name: Summary
        run: |
          echo "V4.1 quantitative candidate set frozen."
          echo "Do NOT open validation yet."
          echo "Next: uniform deep dives only on the frozen queue, then final Blind Discovery freeze."
