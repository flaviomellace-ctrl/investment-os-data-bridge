name: Probe BR-04 T00

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q src

      - name: Run BR-04 T00 census
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python src/probe_br04_t00.py

      - name: Commit T00 report only
        run: |
          git config user.name "investment-os-data-bridge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current/br04_t00_report.json data/current/br04_t00_report.md
          if git diff --cached --quiet; then
            echo "Nessuna modifica T00 da committare."
            exit 0
          fi
          git commit -m "data: BR-04 T00 census"
          git push
