name: BR-04 S4 Engine Preflight

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: br04-s4-engine-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore frozen S4 runtime
        shell: bash
        env:
          V4_SCORING_B64: ""
          TEST_V4_B64: ""
          S4_RUNNER_B64: ""
        run: |
          mkdir -p src/investment_os/v4
          printf '%s' "$V4_SCORING_B64" | base64 --decode > src/investment_os/v4/v4_scoring.py
          printf '%s' "$TEST_V4_B64" | base64 --decode > src/investment_os/v4/test_v4.py
          printf '%s' "$S4_RUNNER_B64" | base64 --decode > src/br04_s4_engine_preflight.py

      - name: Verify frozen V4.1 engine
        run: |
          python - <<'PY2'
          import hashlib
          from pathlib import Path
          p = Path("src/investment_os/v4/v4_scoring.py")
          expected = "68f626974592915d6c2a8e6583d6c77b"
          actual = hashlib.md5(p.read_bytes()).hexdigest()
          print("expected_engine_md5 =", expected)
          print("actual_engine_md5   =", actual)
          if actual != expected:
              raise SystemExit("Frozen V4.1 engine MD5 mismatch")
          PY2

      - name: Syntax check
        run: |
          python -m py_compile \
            src/investment_os/v4/v4_scoring.py \
            src/investment_os/v4/test_v4.py \
            src/br04_s4_engine_preflight.py

      - name: Run frozen V4.1 regression suite
        run: python src/investment_os/v4/test_v4.py

      - name: Resolve latest S3-approved candidate
        shell: bash
        run: |
          S1_RUN_ID="$(
            python - <<'PY2'
          import hashlib
          import json
          from pathlib import Path

          base = Path("data/staging/br04")
          found = []

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          for p in base.glob("*/evidence/br04_transport.json"):
              try:
                  report = json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  continue

              if report.get("phase") != "S3" or report.get("overall_passed") is not True:
                  continue

              run_dir = p.parents[1]
              run_id = run_dir.name
              if not run_id.isdigit():
                  continue

              candidate = run_dir / "candidate" / "sp500_fundamentals.csv"
              index_path = run_dir / "candidate" / "fundamentals_chunks.json"
              regression_path = run_dir / "evidence" / "br04_regression.json"
              if not candidate.exists() or not index_path.exists() or not regression_path.exists():
                  continue

              try:
                  index = json.loads(index_path.read_text(encoding="utf-8"))
                  regression = json.loads(regression_path.read_text(encoding="utf-8"))
              except Exception:
                  continue

              expected_sha = str(report.get("candidate_sha256", "")).strip()
              if not expected_sha:
                  continue
              if regression.get("overall_passed") is not True:
                  continue
              if regression.get("candidate_sha256") != expected_sha:
                  continue
              if index.get("source_sha256") != expected_sha:
                  continue
              if sha256_file(candidate) != expected_sha:
                  continue
              if index.get("transport_validation", {}).get("reassembled_byte_identical") is not True:
                  continue

              found.append(int(run_id))

          if not found:
              raise SystemExit("No S3-approved BR-04 candidate found")

          print(max(found))
          PY2
          )"

          echo "S1_RUN_ID=${S1_RUN_ID}" >> "$GITHUB_ENV"
          echo "Using S3-approved S1 candidate run ${S1_RUN_ID}"

      - name: Run BR-04 S4 / T18
        run: |
          python src/br04_s4_engine_preflight.py \
            --s1-run-id "${S1_RUN_ID}"

      - name: Verify S4 evidence
        run: |
          python - <<'PY2'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["S1_RUN_ID"]
          p = Path("data/staging/br04") / run_id / "evidence" / "br04_t18_engine_run.json"
          j = json.loads(p.read_text(encoding="utf-8"))

          print("S1_RUN_ID =", run_id)
          print("candidate_sha256 =", j.get("candidate_sha256"))
          print("engine_md5 =", j.get("engine_md5"))
          print("exceptions =", j.get("exceptions"))
          print("overall_passed =", j.get("overall_passed"))

          if j.get("engine_md5_verified") is not True:
              raise SystemExit("Engine MD5 not verified")
          if j.get("candidate_sha256_verified") is not True:
              raise SystemExit("Candidate SHA-256 not verified")
          if j.get("exceptions") != 0:
              raise SystemExit("S4 engine preflight produced exceptions")
          if j.get("overall_passed") is not True:
              raise SystemExit("BR04-T18 did not pass")
          if any(j.get(k) is not False for k in (
              "individual_data_emitted",
              "ranking_emitted",
              "tickers_emitted",
              "blind_test_executed",
              "data_current_modified",
              "candidate_promoted",
          )):
              raise SystemExit("S4 invariant violation")
          PY2

      - name: Commit S4 evidence only
        run: |
          ROOT="data/staging/br04/${S1_RUN_ID}/evidence"

          git config user.name "investment-os-data-bridge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "${ROOT}/br04_t18_engine_run.json" \
            "${ROOT}/br04_t18_engine_run.md"

          if git diff --cached --quiet; then
            echo "Nessuna nuova evidenza S4 da committare."
          else
            git commit -m "data: BR-04 S4 engine preflight ${S1_RUN_ID}"
            git push
          fi

      - name: Enforce S4 gate
        run: |
          python - <<'PY2'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["S1_RUN_ID"]
          p = Path("data/staging/br04") / run_id / "evidence" / "br04_t18_engine_run.json"
          j = json.loads(p.read_text(encoding="utf-8"))
          if j.get("overall_passed") is not True:
              raise SystemExit("S4/T18 failed. Do not proceed to S5.")
          print("BR-04 S4 / T18 PASS")
          PY2
