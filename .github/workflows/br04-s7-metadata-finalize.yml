name: BR-04 S7 Metadata Finalize

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: br04-s7-metadata-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      S1_RUN_ID: "35977079536"
      APPROVED_CANDIDATE_SHA256: "d2207e92bbe6cc0ef883db6a54d93ac965b08da487741b4de8e2459ed6282f45"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Finalize canonical metadata and re-verify transport
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          CURRENT = ROOT / "data" / "current"
          STAGING_EVIDENCE = (
              ROOT / "data" / "staging" / "br04"
              / os.environ["S1_RUN_ID"] / "evidence"
          )
          APPROVED = os.environ["APPROVED_CANDIDATE_SHA256"].strip()
          REPO = os.environ.get("GITHUB_REPOSITORY", "").strip()
          RUN_ID = os.environ.get("GITHUB_RUN_ID", "").strip()

          CSV = CURRENT / "sp500_fundamentals.csv"
          INDEX = CURRENT / "fundamentals_chunks.json"
          INDEX_MD = CURRENT / "fundamentals_chunks.md"
          STATUS = CURRENT / "status.md"
          MANIFEST = CURRENT / "manifest.json"

          def now_iso() -> str:
              return datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def load_json(path: Path) -> dict:
              return json.loads(path.read_text(encoding="utf-8"))

          def csv_records_raw(data: bytes) -> list[bytes]:
              records = []
              start = 0
              i = 0
              in_quotes = False
              while i < len(data):
                  b = data[i]
                  if b == 0x22:
                      if in_quotes and i + 1 < len(data) and data[i + 1] == 0x22:
                          i += 2
                          continue
                      in_quotes = not in_quotes
                      i += 1
                      continue
                  if b == 0x0A and not in_quotes:
                      records.append(data[start:i+1])
                      start = i + 1
                  i += 1
              if in_quotes:
                  raise ValueError("Unclosed quoted field")
              if start < len(data):
                  records.append(data[start:])
              return records

          if not all(p.exists() for p in (CSV, INDEX, INDEX_MD, STATUS, MANIFEST)):
              raise SystemExit("Required canonical metadata file missing")

          canonical_sha_before = sha256_file(CSV)
          if canonical_sha_before != APPROVED:
              raise SystemExit(
                  "BLOCK: canonical fundamentals no longer match approved BR-04 candidate"
              )

          s7_path = STAGING_EVIDENCE / "br04_s7_post_promotion.json"
          s7 = load_json(s7_path)
          if s7.get("result") != "PASS" or s7.get("br04_closed") is not True:
              raise SystemExit("BLOCK: S7 PASS evidence missing or not closed")
          if s7.get("candidate_sha256") != APPROVED:
              raise SystemExit("BLOCK: S7 candidate hash differs from approved candidate")

          generated_at = now_iso()

          # 1) Canonicalize transport URLs in JSON.
          index = load_json(INDEX)
          if index.get("source_sha256") != APPROVED:
              raise SystemExit("BLOCK: chunk manifest source_sha256 mismatch")

          url_base = f"https://raw.githubusercontent.com/{REPO}/main/data/current"
          for p in index.get("parts", []):
              p["url"] = f"{url_base}/{p['filename']}"

          INDEX.write_text(
              json.dumps(index, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          # 2) Canonicalize URLs in the human-readable chunk manifest.
          md = INDEX_MD.read_text(encoding="utf-8")
          md = re.sub(
              r"https://raw\.githubusercontent\.com/"
              + re.escape(REPO)
              + r"/main/data/staging/br04/\d+/candidate/"
              + r"(sp500_fundamentals_part_\d+\.csv)",
              lambda m: f"{url_base}/{m.group(1)}",
              md,
          )
          INDEX_MD.write_text(md, encoding="utf-8")

          # 3) Remove stale "S7 still required" sentence and refresh status timestamp.
          status = STATUS.read_text(encoding="utf-8")
          status = status.replace(
              "S7 post-promotion verification is still required before BR-04 is considered fully closed.\n",
              "",
          )
          status = re.sub(
              r"Aggiornato:\s+\*\*[^*]+\*\*",
              f"Aggiornato: **{generated_at}**",
              status,
              count=1,
          )
          marker = "## BR-04 S7 — METADATA FINALIZED"
          if marker not in status:
              status = status.rstrip() + f"""

          {marker}

          - Finalization run: **{RUN_ID}**
          - Finalized at: **{generated_at}**
          - Transport URLs point to: `data/current/`
          - `fundamentals_chunks.json` canonical URLs: **YES**
          - `fundamentals_chunks.md` canonical URLs: **YES**
          - Manifest output hashes refreshed: **YES**
          - Canonical fundamentals SHA-256 unchanged: `{APPROVED}`
          - BR04-T20 re-verified after metadata finalization: **PASS**
          - Blind Test: **NOT EXECUTED**
          """
          STATUS.write_text(
              "\n".join(line.strip() for line in status.splitlines()) + "\n",
              encoding="utf-8",
          )

          # 4) Re-verify all transport invariants after the URL-only metadata edit.
          index = load_json(INDEX)
          source_raw = CSV.read_bytes()
          records = csv_records_raw(source_raw)
          if not records:
              raise SystemExit("Canonical CSV empty")
          header = records[0]
          hard_max = int(index.get("hard_max_bytes", 0))
          expected_start = 1
          rows_sum = 0
          out = bytearray()
          part_hash_failures = 0
          urls_current = True

          parts = index.get("parts", [])
          for i, p in enumerate(parts):
              path = CURRENT / p["filename"]
              if not path.exists():
                  raise SystemExit(f"Missing canonical chunk: {p['filename']}")
              data = path.read_bytes()

              if sha256_bytes(data) != p.get("sha256"):
                  part_hash_failures += 1
              if len(data) > hard_max:
                  raise SystemExit(f"Chunk exceeds hard max: {p['filename']}")
              if int(p.get("row_start_1_based", 0)) != expected_start:
                  raise SystemExit(f"Non-contiguous chunk range: {p['filename']}")
              rows = int(p.get("rows", 0))
              end = int(p.get("row_end_1_based", 0))
              if end != expected_start + rows - 1:
                  raise SystemExit(f"Invalid chunk row range: {p['filename']}")
              expected_start = end + 1
              rows_sum += rows

              expected_url = f"{url_base}/{p['filename']}"
              if p.get("url") != expected_url:
                  urls_current = False

              if not data.startswith(header):
                  raise SystemExit(f"Chunk header mismatch: {p['filename']}")
              if i == 0:
                  out.extend(data)
              else:
                  out.extend(data[len(header):])

          reassembled = bytes(out)
          checks = {
              "canonical_sha_unchanged": sha256_file(CSV) == APPROVED,
              "source_sha_matches": index.get("source_sha256") == APPROVED,
              "part_sha256_failures_zero": part_hash_failures == 0,
              "rows_match": rows_sum == int(index.get("total_rows", 0)) == len(records) - 1,
              "ranges_contiguous": expected_start - 1 == rows_sum,
              "part_count_matches": len(parts) == int(index.get("total_parts", 0)),
              "reassembled_byte_identical": reassembled == source_raw,
              "reassembled_sha_matches": sha256_bytes(reassembled) == APPROVED,
              "all_urls_point_to_current": urls_current,
              "md_has_no_staging_urls": "/data/staging/br04/" not in INDEX_MD.read_text(encoding="utf-8"),
              "status_has_no_stale_s7_required_line": (
                  "S7 post-promotion verification is still required" not in STATUS.read_text(encoding="utf-8")
              ),
          }

          failed = [k for k, v in checks.items() if not v]
          if failed:
              raise SystemExit("Metadata finalization verification failed: " + ", ".join(failed))

          # 5) Refresh canonical manifest fields and output hashes.
          manifest = load_json(MANIFEST)
          br04 = manifest.setdefault("br04_debt_interest", {})
          if br04.get("candidate_sha256") != APPROVED:
              raise SystemExit("Manifest BR-04 candidate hash mismatch")

          br04["phase"] = "S7_VERIFIED"
          br04["canonical_path"] = "data/current/sp500_fundamentals.csv"
          br04["transport_urls_scope"] = "data/current"
          br04["metadata_finalized_at_utc"] = generated_at
          br04["metadata_finalization_run_id"] = RUN_ID
          br04["s7_post_promotion_verified"] = True
          br04["s7_t20_passed"] = True
          br04["blind_test_executed"] = False

          manifest["updated_at_utc"] = generated_at
          outputs = manifest.setdefault("outputs", {})
          for name in (
              "sp500_fundamentals.csv",
              "fundamentals_chunks.json",
              "fundamentals_chunks.md",
              "status.md",
          ):
              p = CURRENT / name
              outputs[name] = {
                  "sha256": sha256_file(p),
                  "bytes": p.stat().st_size,
              }

          MANIFEST.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          evidence = {
              "schema": "br04_s7_metadata_finalize_v1.0",
              "phase": "S7_METADATA_FINALIZE",
              "run_id": RUN_ID,
              "generated_at_utc": generated_at,
              "candidate_sha256": APPROVED,
              "canonical_sha256_before": canonical_sha_before,
              "canonical_sha256_after": sha256_file(CSV),
              "checks": checks,
              "fundamentals_chunks_json_sha256": sha256_file(INDEX),
              "fundamentals_chunks_md_sha256": sha256_file(INDEX_MD),
              "status_sha256": sha256_file(STATUS),
              "manifest_schema_version": manifest.get("schema_version"),
              "blind_test_executed": False,
              "overall_passed": True,
          }
          STAGING_EVIDENCE.mkdir(parents=True, exist_ok=True)
          (STAGING_EVIDENCE / "br04_s7_metadata_finalize.json").write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          print("BR-04 S7 metadata finalization PASS")
          print("canonical_sha256 =", sha256_file(CSV))
          print("transport URLs =", "data/current")
          print("T20 re-verification =", "PASS")
          print("Blind Test =", "NOT EXECUTED")
          PY

      - name: Commit finalized metadata
        run: |
          git config user.name "investment-os-data-bridge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "data/current/fundamentals_chunks.json" \
            "data/current/fundamentals_chunks.md" \
            "data/current/status.md" \
            "data/current/manifest.json" \
            "data/staging/br04/${S1_RUN_ID}/evidence/br04_s7_metadata_finalize.json"

          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 1
          fi

          git commit -m "data: finalize BR-04 S7 canonical metadata"
          git push

      - name: Summary
        run: |
          echo "BR-04 S7 metadata finalization completed."
          echo "Canonical fundamentals were not modified."
          echo "Blind Test was NOT executed."
