name: V4.3 primary source investigation (read-only)

# Evidence acquisition only. This branch does not compose or promote data.
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: v43-primary-source-investigation
  cancel-in-progress: false
jobs:
  acquire:
    if: github.ref == 'refs/heads/codex/v43-primary-source-investigation-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch primary SEC evidence (no repository checkout)
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          PRIMARY_OUT: ${{ runner.temp }}/v43_primary_sources
        run: |
          set -euo pipefail
          python3 -B - <<'PYCODE'
          #!/usr/bin/env python3
          """Read-only SEC acquisition. Writes evidence only; no correction or promotion."""
          import gzip
          import hashlib
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from html.parser import HTMLParser
          from pathlib import Path
          
          COMPANIES = [19617, 36104, 51434, 63908, 76334, 93410, 93751, 766704, 1031296, 1099219, 1868275]
          FILINGS = [(63908, '0000063908-26-000035', '10-K'), (76334, '0000076334-25-000035', '10-K'), (1031296, '0001031296-26-000046', '10-K'), (1868275, '0001868275-26-000032', '10-K'), (766704, '0000766704-26-000010', '10-K'), (51434, '0000051434-26-000055', '10-K'), (1099219, '0001099219-26-000013', '10-K'), (19617, '0001628280-26-008131', '10-K'), (93410, '0000093410-26-000078', '10-K'), (36104, '0000036104-26-000011', '10-K'), (93751, '0000093751-26-000124', '10-K'), (63908, '0000063908-25-000012', '10-K'), (63908, '0000063908-23-000012', '10-K')]
          
          def now():
              return datetime.now(timezone.utc).isoformat()
          
          def digest(b):
              return hashlib.sha256(b).hexdigest()
          
          class IndexRows(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.rows = []
                  self.row = None
                  self.cell = None
          
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'tr':
                      self.row = []
                  elif tag == 'td' and self.row is not None:
                      self.cell = {'text': '', 'links': []}
                  elif tag == 'a' and self.cell is not None:
                      self.cell['links'].append(attrs.get('href', ''))
          
              def handle_data(self, data):
                  if self.cell is not None:
                      self.cell['text'] += data
          
              def handle_endtag(self, tag):
                  if tag == 'td' and self.row is not None and self.cell is not None:
                      self.cell['text'] = ' '.join(self.cell['text'].split())
                      self.row.append(self.cell)
                      self.cell = None
                  elif tag == 'tr' and self.row is not None:
                      self.rows.append(self.row)
                      self.row = None
          
          def document_url(href, index_url, archive_prefix):
              u = urllib.parse.urljoin(index_url, href)
              p = urllib.parse.urlsplit(u)
              if p.path in ('/ix', '/ixviewer/doc/action'):
                  docs = urllib.parse.parse_qs(p.query).get('doc', [])
                  if len(docs) != 1:
                      raise ValueError('ambiguous iXBRL document link')
                  u = urllib.parse.urljoin(index_url, docs[0])
                  p = urllib.parse.urlsplit(u)
              if p.scheme != 'https' or p.hostname != 'www.sec.gov' or not re.fullmatch(r'/Archives/edgar/data/[0-9]+/'+re.escape(archive_prefix.rstrip('/').split('/')[-1])+r'/[^/]+', p.path) or p.query or p.fragment or '..' in p.path.split('/'):
                  raise ValueError('document link outside pinned filing directory')
              return u
          
          def select_documents(html, index_url, archive_prefix, form):
              p = IndexRows()
              p.feed(html)
              primary = []
              instance = []
              for row in p.rows:
                  if len(row) < 4:
                      continue
                  description, doc, kind = row[1], row[2], row[3]
                  if kind['text'] == form:
                      primary.extend(document_url(x, index_url, archive_prefix) for x in doc['links'] if urllib.parse.urlsplit(x).path.lower().endswith(('.htm','.html')) or urllib.parse.urlsplit(x).path in ('/ix','/ixviewer/doc/action'))
                  if 'EXTRACTED XBRL INSTANCE DOCUMENT' in description['text'].upper():
                      instance.extend(document_url(x, index_url, archive_prefix) for x in doc['links'])
              if len(set(primary)) != 1 or len(set(instance)) != 1:
                  raise ValueError('primary document or extracted instance missing/ambiguous')
              return sorted(set(primary))[0], sorted(set(instance))[0]
          
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  p = urllib.parse.urlsplit(newurl)
                  if p.scheme != 'https' or p.hostname not in ('www.sec.gov', 'data.sec.gov'):
                      raise ValueError('redirect outside SEC')
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          
          def main():
              out = Path(os.environ['PRIMARY_OUT'])
              if out.exists():
                  raise ValueError('output directory exists')
              email = os.environ.get('SEC_CONTACT_EMAIL', '').strip()
              if '@' not in email:
                  raise ValueError('SEC_CONTACT_EMAIL is required')
              out.mkdir(parents=True)
              (out / 'raw').mkdir()
              entries, errors = [], []
              opener = urllib.request.build_opener(SafeRedirect())
          
              def fetch(url, name, role, identity):
                  time.sleep(0.55)
                  entry = {'url': url, 'role': role, 'identity': identity, 'retrieved_at_utc': now()}
                  try:
                      req = urllib.request.Request(url, headers={
                          'User-Agent': 'InvestmentOSSourceInvestigation/1.0 ' + email,
                          'Accept-Encoding': 'identity',
                      })
                      with opener.open(req, timeout=60) as response:
                          body = response.read(50 * 1024 * 1024 + 1)
                          if len(body) > 50 * 1024 * 1024:
                              raise ValueError('response exceeds acquisition limit')
                          entry.update(http_status=response.status, final_url=response.url,
                                       response_headers={k: v for k, v in response.headers.items()
                                                         if k.lower() in ('content-type', 'content-encoding', 'content-length', 'date', 'etag', 'last-modified', 'server')})
                          encoding = response.headers.get('Content-Encoding', 'identity').lower()
                      path = 'raw/' + name
                      (out / path).write_bytes(body)
                      entry.update(file=path, bytes=len(body), sha256=digest(body), status='FETCHED')
                      entries.append(entry)
                      if encoding == 'gzip':
                          return gzip.decompress(body)
                      if encoding not in ('identity', ''):
                          raise ValueError('unsupported HTTP content encoding')
                      return body
                  except Exception as exc:
                      if entry not in entries:
                          entry['status'] = 'FETCH_FAILED'
                          if isinstance(exc, urllib.error.HTTPError):
                              entry['http_status'] = exc.code
                          entries.append(entry)
                      errors.append({'url': url, 'role': role, 'error_type': type(exc).__name__,
                                     'http_status': getattr(exc, 'code', None)})
                      print('Acquisition failed:', role, identity, type(exc).__name__)
                      return None
          
              for cik in COMPANIES:
                  body = fetch(f'https://data.sec.gov/api/xbrl/companyfacts/CIK{cik:010d}.json',
                               f'CIK{cik:010d}_companyfacts.json', 'COMPANYFACTS', {'cik': cik})
                  if body is not None:
                      try:
                          j = json.loads(body)
                          if int(j.get('cik', -1)) != cik or not isinstance(j.get('facts'), dict):
                              raise ValueError('companyfacts identity/shape mismatch')
                      except Exception as exc:
                          errors.append({'role': 'COMPANYFACTS_VALIDATION', 'cik': cik, 'error_type': type(exc).__name__})
          
              for cik, accession, form in FILINGS:
                  compact = accession.replace('-', '')
                  prefix = f'/Archives/edgar/data/{cik}/{compact}/'
                  index_url = f'https://www.sec.gov{prefix}{accession}-index.htm'
                  identity = {'cik': cik, 'accession': accession, 'form': form}
                  body = fetch(index_url, accession + '_index.htm', 'FILING_INDEX', identity)
                  if body is None:
                      continue
                  try:
                      primary, instance = select_documents(body.decode('utf-8'), index_url, prefix, form)
                  except Exception as exc:
                      errors.append({'role': 'FILING_INDEX_SELECTION', **identity, 'error_type': type(exc).__name__})
                      continue
                  fetch(primary, accession + '_primary.htm', 'PRIMARY_IXBRL', identity)
                  fetch(instance, accession + '_instance.xml', 'EXTRACTED_INSTANCE', identity)
          
              targets = {'companies': COMPANIES, 'filings': FILINGS}
              receipt = {'schema': 'v43_primary_acquisition_v1', 'scope': 'EVIDENCE_ONLY',
                         'created_at_utc': now(), 'github_run_id': os.environ.get('GITHUB_RUN_ID'),
                         'github_sha': os.environ.get('GITHUB_SHA'),
                         'targets': targets, 'target_sha256': digest(json.dumps(targets, sort_keys=True).encode()),
                         'entries': entries, 'errors': errors, 'acquisition_complete': not errors,
                         'economic_clearance': False, 'candidate_promoted': False, 'buy_add_allowed': False}
              data = (json.dumps(receipt, indent=2, allow_nan=False) + '\n').encode()
              (out / 'PRIMARY_RECEIPT.json').write_bytes(data)
              sha = digest(data)
              summary = {'PRIMARY_RECEIPT_SHA256': sha, 'files_fetched': sum(e['status'] == 'FETCHED' for e in entries),
                         'errors': len(errors), 'acquisition_complete': not errors,
                         'candidate_promoted': False, 'buy_add_allowed': False}
              (out / 'ACQUISITION_SUMMARY.json').write_text(json.dumps(summary, indent=2) + '\n')
              print(json.dumps(summary))
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                      f.write('## V4.3 primary-source acquisition\n\n' + '\n'.join(f'- {k}: `{v}`' for k, v in summary.items()) + '\n')
              return 2 if errors else 0
          
          if __name__ == '__main__':
              sys.exit(main())
          PYCODE
      - name: Preserve raw sources and acquisition receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official v4, pinned
        with:
          name: v43-primary-sources-${{ github.run_id }}
          path: ${{ runner.temp }}/v43_primary_sources
          if-no-files-found: error
          retention-days: 90
