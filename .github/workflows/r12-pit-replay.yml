name: R12 point-in-time replay (research only)

on:
  push:
    branches: ["claude/r12-pit-replay"]
    paths: ["pit/run_config.json"]

permissions:
  contents: read

concurrency:
  group: r12-pit-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Replay in a scratch copy
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          set -euo pipefail
          CFG=pit/run_config.json
          AS_OF=$(python -c "import json;print(json.load(open('$CFG'))['as_of'])")
          UNI=$(python -c "import json;print(json.load(open('$CFG'))['universe'])")
          STAGES=$(python -c "import json;print(json.load(open('$CFG'))['stages'])")
          CMP=$(python -c "import json;print(json.load(open('$CFG')).get('compare_to_current', False))")
          SCRATCH="$RUNNER_TEMP/pit"
          mkdir -p "$SCRATCH/data/current" "$SCRATCH/data/archive"
          cp -r src "$SCRATCH/src"
          cp "$UNI" "$SCRATCH/universe.csv"
          sha256sum data/current/sp500_fundamentals.csv > "$RUNNER_TEMP/before.sha"
          PIT_AS_OF="$AS_OF" PIT_UNIVERSE="$SCRATCH/universe.csv" PIT_STAGES="$STAGES" python "$SCRATCH/src/pit_replay.py"
          sha256sum -c "$RUNNER_TEMP/before.sha"
          if [ "$CMP" = "True" ]; then python src/pit_compare.py "$SCRATCH/data/current/sp500_fundamentals.csv" data/current/sp500_fundamentals.csv; fi
          mkdir -p out && cp -r "$SCRATCH/data/current" out/replay && cp "$CFG" out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-replay-${{ github.run_id }}
          path: out
          if-no-files-found: warn
