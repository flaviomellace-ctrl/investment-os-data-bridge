name: R12 point-in-time replay (research only)

on:
  push:
    branches: ["claude/r12-pit-replay"]
    paths: ["pit/run_config.json"]

permissions:
  contents: write

concurrency:
  group: r12-pit-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Replay each as-of date in its own scratch copy
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          PIT_CACHE: ${{ runner.temp }}/fsds_cache
        run: |
          set -euo pipefail
          CFG=pit/run_config.json
          LABEL=$(python -c "import json;print(json.load(open('$CFG'))['label'])")
          STAGES=$(python -c "import json;print(json.load(open('$CFG'))['stages'])")
          for AS_OF in $(python -c "import json;print(' '.join(json.load(open('$CFG'))['as_of_list']))"); do
            S="$RUNNER_TEMP/pit_$AS_OF"; rm -rf "$S"; mkdir -p "$S/data/current" "$S/data/archive"
            cp -r src "$S/src"
            python src/pit_universe.py "$AS_OF" "$S/universe.csv" | tee "$RUNNER_TEMP/u_$AS_OF.log"
            PIT_AS_OF="$AS_OF" PIT_UNIVERSE="$S/universe.csv" PIT_STAGES="$STAGES" GITHUB_RUN_ID="pit_${AS_OF}" \
              python "$S/src/pit_replay.py" 2>&1 | tee "$RUNNER_TEMP/r_$AS_OF.log" | grep -E "PIT|BLOCK|Error|Traceback" || true
            test -f "$S/data/current/pit_candidate.csv"
            O="pit/out/$LABEL/$AS_OF"; mkdir -p "$O"
            cp "$S/data/current/pit_candidate.csv" "$O/pit_candidate.csv"
            cp "$S/universe.csv" "$S/universe.json" "$O/"
            grep -E "^PIT" "$RUNNER_TEMP/r_$AS_OF.log" "$RUNNER_TEMP/u_$AS_OF.log" > "$O/run_log.txt" || true
            sha256sum "$O"/* > "$O/SHA256SUMS"
          done
      - name: Commit outputs to the research branch
        run: |
          git config user.name "investment-os-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pit/out
          git commit -m "R12 PIT replay outputs ($GITHUB_RUN_ID)" || exit 0
          git push
