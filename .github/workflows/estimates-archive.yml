name: Estimates archive

on:
  workflow_dispatch:
  schedule:
    # Giorni feriali dopo la chiusura USA.
    - cron: "52 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: estimates-archive
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "requests>=2.32,<3"
      - run: python src/estimates_snapshot.py
      - name: Commit
        run: |
          git config user.name "investment-os-data-bridge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/estimates data/current/estimates_latest.csv data/current/estimate_revisions.csv
          if git diff --cached --quiet; then echo "Nessuna modifica."; exit 0; fi
          git commit -m "data: estimates snapshot $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
