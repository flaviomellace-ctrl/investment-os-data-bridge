name: V4.2 R10G Lease Source Reconciliation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/r10f_verify_source_corrections.py
      - tests/test_r10f_source_corrections.py
      - requirements-r10f.txt
      - data/v4_2/r10g/review_20260928/**
      - .github/workflows/v4-2-r10g-lease-reconciliation.yml

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated source-review dependency
        run: python -m pip install -r requirements-r10f.txt
      - name: Synthetic source integrity tests
        run: python tests/test_r10f_source_corrections.py
      - name: Retrieve sealed R10E primary sources
        uses: actions/download-artifact@v4
        with:
          name: r10e-primary-evidence-36336222379-1
          github-token: ${{ github.token }}
          run-id: '36336222379'
          path: ${{ runner.temp }}/r10g-source-archive
      - name: Verify all reviewed source corrections
        run: |
          python src/r10f_verify_source_corrections.py \
            --registry data/v4_2/r10g/review_20260928/V4_2_R10G_LEASE_SOURCE_REVIEW.json \
            --sources "${RUNNER_TEMP}/r10g-source-archive/_temp/r10e_primary_sources" \
            --output "${RUNNER_TEMP}/r10g-receipt.json"
          cmp "${RUNNER_TEMP}/r10g-receipt.json" data/v4_2/r10g/review_20260928/V4_2_R10G_VERIFICATION_RECEIPT.json
          git diff --exit-code
      - name: Summary
        run: |
          echo '## R10G lease source reconciliation verified' >> "$GITHUB_STEP_SUMMARY"
          echo '45 reviewed source items match pinned filing bytes, inline facts, units, periods and scopes.' >> "$GITHUB_STEP_SUMMARY"
          echo '8 synthetic integrity tests passed. Frozen engine and ranking unchanged.' >> "$GITHUB_STEP_SUMMARY"
          echo 'These are source corrections and proposals, not closed due-diligence cases. System NOT LIVE.' >> "$GITHUB_STEP_SUMMARY"
