name: BR-04 S7 Post-Promotion Verify

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: br04-s7-post-promotion
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      S1_RUN_ID: "35977079536"
      APPROVED_CANDIDATE_SHA256: "d2207e92bbe6cc0ef883db6a54d93ac965b08da487741b4de8e2459ed6282f45"
      APPROVED_BASE_SHA256: "c95e356632182dddd85b002a552eefa83da27264838617d8661af895fbb69594"
      EXPECTED_ARCHIVE_PATH: "data/archive/20260924T104550Z"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify canonical and T20; rollback on critical failure
        id: s7
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          ROOT = Path.cwd()
          S1_RUN_ID = os.environ["S1_RUN_ID"]
          APPROVED_CANDIDATE = os.environ["APPROVED_CANDIDATE_SHA256"].strip()
          APPROVED_BASE = os.environ["APPROVED_BASE_SHA256"].strip()
          EXPECTED_ARCHIVE = ROOT / os.environ["EXPECTED_ARCHIVE_PATH"]
          S7_RUN_ID = os.environ.get("GITHUB_RUN_ID", "").strip()

          CURRENT = ROOT / "data" / "current"
          EVIDENCE = ROOT / "data" / "staging" / "br04" / S1_RUN_ID / "evidence"
          CURRENT_CSV = CURRENT / "sp500_fundamentals.csv"
          INDEX_PATH = CURRENT / "fundamentals_chunks.json"
          MANIFEST_PATH = CURRENT / "manifest.json"
          STATUS_PATH = CURRENT / "status.md"

          def now_iso() -> str:
              return datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()

          def load_json(path: Path) -> dict:
              if not path.exists():
                  raise FileNotFoundError(str(path))
              return json.loads(path.read_text(encoding="utf-8"))

          def csv_records_raw(data: bytes) -> list[bytes]:
              if not data:
                  return []
              records = []
              start = 0
              i = 0
              in_quotes = False
              while i < len(data):
                  b = data[i]
                  if b == 0x22:
                      if in_quotes and i + 1 < len(data) and data[i + 1] == 0x22:
                          i += 2
                          continue
                      in_quotes = not in_quotes
                      i += 1
                      continue
                  if b == 0x0A and not in_quotes:
                      records.append(data[start:i+1])
                      start = i + 1
                  i += 1
              if in_quotes:
                  raise ValueError("Invalid CSV: unclosed quoted field")
              if start < len(data):
                  records.append(data[start:])
              return records

          generated_at = now_iso()
          EVIDENCE.mkdir(parents=True, exist_ok=True)

          critical_failure = False
          rollback_reason = []
          checks = {}
          details = {}

          # ----------------------- canonical hash -----------------------
          if not CURRENT_CSV.exists():
              checks["canonical_file_exists"] = False
              critical_failure = True
              rollback_reason.append("canonical_file_missing")
              current_sha = None
          else:
              checks["canonical_file_exists"] = True
              current_sha = sha256_file(CURRENT_CSV)
              checks["canonical_sha_matches_approved_candidate"] = (
                  current_sha == APPROVED_CANDIDATE
              )
              if not checks["canonical_sha_matches_approved_candidate"]:
                  critical_failure = True
                  rollback_reason.append("canonical_sha_mismatch")

          details["current_sha256"] = current_sha
          details["expected_candidate_sha256"] = APPROVED_CANDIDATE

          # ----------------------- canonical T20 ------------------------
          t20 = {
              "index_exists": INDEX_PATH.exists(),
              "part_sha256_failures": None,
              "rows_match_source": False,
              "ranges_contiguous": False,
              "all_parts_under_hard_max": False,
              "reassembled_byte_identical": False,
              "reassembled_sha256_matches_source": False,
              "source_sha256_matches_approved_candidate": False,
              "total_parts_declared": None,
              "total_parts_read": 0,
              "rows_declared": None,
              "rows_from_parts": 0,
          }

          try:
              index = load_json(INDEX_PATH)
              t20["source_sha256_matches_approved_candidate"] = (
                  index.get("source_sha256") == APPROVED_CANDIDATE
              )
              t20["total_parts_declared"] = int(index.get("total_parts", 0))
              t20["rows_declared"] = int(index.get("total_rows", 0))
              hard_max = int(index.get("hard_max_bytes", 0))
              parts_meta = index.get("parts", [])

              if len(parts_meta) != t20["total_parts_declared"]:
                  raise ValueError("index parts count differs from total_parts")

              if not CURRENT_CSV.exists():
                  raise ValueError("canonical source missing")
              source_raw = CURRENT_CSV.read_bytes()
              records = csv_records_raw(source_raw)
              if not records:
                  raise ValueError("canonical CSV empty")
              header = records[0]

              part_hash_failures = 0
              rows_sum = 0
              expected_start = 1
              contiguous = True
              under_max = True
              out = bytearray()

              for idx, p in enumerate(parts_meta):
                  path = CURRENT / p["filename"]
                  if not path.exists():
                      raise ValueError(f"chunk missing: {p['filename']}")
                  data = path.read_bytes()
                  t20["total_parts_read"] += 1

                  if sha256_bytes(data) != p.get("sha256"):
                      part_hash_failures += 1

                  if hard_max <= 0 or len(data) > hard_max:
                      under_max = False

                  rows = int(p.get("rows", 0))
                  rows_sum += rows
                  start = int(p.get("row_start_1_based", 0))
                  end = int(p.get("row_end_1_based", 0))
                  if start != expected_start or end != start + rows - 1:
                      contiguous = False
                  expected_start = end + 1

                  if not data.startswith(header):
                      raise ValueError(f"chunk does not start with canonical header: {p['filename']}")
                  if idx == 0:
                      out.extend(data)
                  else:
                      out.extend(data[len(header):])

              reassembled = bytes(out)
              t20["part_sha256_failures"] = part_hash_failures
              t20["rows_from_parts"] = rows_sum
              t20["rows_match_source"] = (
                  rows_sum == t20["rows_declared"]
                  and t20["rows_declared"] == len(records) - 1
              )
              t20["ranges_contiguous"] = (
                  contiguous and expected_start - 1 == t20["rows_declared"]
              )
              t20["all_parts_under_hard_max"] = under_max
              t20["reassembled_byte_identical"] = reassembled == source_raw
              t20["reassembled_sha256_matches_source"] = (
                  sha256_bytes(reassembled) == sha256_bytes(source_raw)
              )

          except Exception as exc:
              t20["exception"] = f"{type(exc).__name__}: {exc}"

          t20_pass = all([
              t20["index_exists"],
              t20["source_sha256_matches_approved_candidate"],
              t20["part_sha256_failures"] == 0,
              t20["rows_match_source"],
              t20["ranges_contiguous"],
              t20["all_parts_under_hard_max"],
              t20["reassembled_byte_identical"],
              t20["reassembled_sha256_matches_source"],
              t20["total_parts_declared"] == t20["total_parts_read"],
          ])
          checks["canonical_t20_passed"] = t20_pass
          if not t20_pass:
              critical_failure = True
              rollback_reason.append("canonical_t20_failed")

          # ----------------------- metadata checks -----------------------
          metadata_errors = []
          manifest = None
          try:
              manifest = load_json(MANIFEST_PATH)
              br04 = manifest.get("br04_debt_interest", {})
              checks["manifest_schema_1_4"] = str(manifest.get("schema_version")) == "1.4"
              checks["manifest_candidate_matches"] = br04.get("candidate_sha256") == APPROVED_CANDIDATE
              checks["manifest_base_matches"] = br04.get("base_canonical_sha256") == APPROVED_BASE
              checks["manifest_t31_present"] = bool(br04.get("t31_run_id"))
              checks["manifest_s7_previously_false_or_true"] = br04.get("s7_post_promotion_verified") in (False, True)
              checks["manifest_blind_test_false"] = br04.get("blind_test_executed") is False
          except Exception as exc:
              metadata_errors.append(f"manifest: {type(exc).__name__}: {exc}")

          checks["archive_exists"] = EXPECTED_ARCHIVE.exists()
          archive_sha = None
          if EXPECTED_ARCHIVE.exists():
              archived_csv = EXPECTED_ARCHIVE / "sp500_fundamentals.csv"
              if archived_csv.exists():
                  archive_sha = sha256_file(archived_csv)
          checks["archive_matches_pre_promotion_base"] = archive_sha == APPROVED_BASE
          details["archive_sha256"] = archive_sha
          details["expected_archive_path"] = EXPECTED_ARCHIVE.relative_to(ROOT).as_posix()

          try:
              status = STATUS_PATH.read_text(encoding="utf-8")
              checks["status_records_promotion"] = "PROMOTED" in status
              checks["status_records_t31_pass"] = "BR04-T31" in status and "PASS" in status
              checks["status_blind_test_not_executed"] = "Blind Test: **NOT EXECUTED**" in status
          except Exception as exc:
              metadata_errors.append(f"status: {type(exc).__name__}: {exc}")

          metadata_check_keys = [
              "manifest_schema_1_4",
              "manifest_candidate_matches",
              "manifest_base_matches",
              "manifest_t31_present",
              "manifest_s7_previously_false_or_true",
              "manifest_blind_test_false",
              "archive_exists",
              "archive_matches_pre_promotion_base",
              "status_records_promotion",
              "status_records_t31_pass",
              "status_blind_test_not_executed",
          ]
          metadata_ok = (
              not metadata_errors
              and all(checks.get(k) is True for k in metadata_check_keys)
          )
          checks["metadata_consistent"] = metadata_ok

          # ----------------------------------------------------------------
          # Contract rollback trigger: canonical hash mismatch OR T20 failure.
          # ----------------------------------------------------------------
          if critical_failure:
              if not EXPECTED_ARCHIVE.exists():
                  raise SystemExit(
                      "S7 CRITICAL FAILURE but rollback archive is missing; "
                      "manual intervention required."
                  )
              archived_csv = EXPECTED_ARCHIVE / "sp500_fundamentals.csv"
              if not archived_csv.exists() or sha256_file(archived_csv) != APPROVED_BASE:
                  raise SystemExit(
                      "S7 CRITICAL FAILURE and archive integrity cannot be proven; "
                      "manual intervention required."
                  )

              # Restore the complete pre-promotion canonical snapshot.
              shutil.rmtree(CURRENT)
              shutil.copytree(EXPECTED_ARCHIVE, CURRENT)

              rollback_evidence = {
                  "schema": "br04_s7_post_promotion_v1.0",
                  "phase": "S7",
                  "s7_run_id": S7_RUN_ID,
                  "generated_at_utc": generated_at,
                  "base_canonical_sha256": APPROVED_BASE,
                  "candidate_sha256": APPROVED_CANDIDATE,
                  "result": "ROLLBACK",
                  "rollback_reason": rollback_reason,
                  "checks": checks,
                  "canonical_t20": t20,
                  "details": details,
                  "blind_test_executed": False,
                  "br04_closed": False,
              }
              (EVIDENCE / "br04_s7_post_promotion.json").write_text(
                  json.dumps(rollback_evidence, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("result=rollback\n")
              print("S7 result: ROLLBACK")
              print("Reasons:", rollback_reason)
              raise SystemExit(0)

          # Hash and T20 are good; metadata inconsistency blocks closure but
          # does NOT trigger rollback under the contract.
          if not metadata_ok:
              failure_evidence = {
                  "schema": "br04_s7_post_promotion_v1.0",
                  "phase": "S7",
                  "s7_run_id": S7_RUN_ID,
                  "generated_at_utc": generated_at,
                  "base_canonical_sha256": APPROVED_BASE,
                  "candidate_sha256": APPROVED_CANDIDATE,
                  "result": "FAIL_METADATA",
                  "checks": checks,
                  "canonical_t20": t20,
                  "details": details,
                  "metadata_errors": metadata_errors,
                  "blind_test_executed": False,
                  "br04_closed": False,
              }
              (EVIDENCE / "br04_s7_post_promotion.json").write_text(
                  json.dumps(failure_evidence, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("result=fail_metadata\n")
              print("S7 result: FAIL_METADATA")
              raise SystemExit(
                  "Canonical hash and T20 pass, but metadata consistency failed. "
                  "No rollback was performed."
              )

          # ----------------------- successful closure ----------------------
          assert manifest is not None
          br04 = manifest["br04_debt_interest"]
          br04["s7_run_id"] = S7_RUN_ID
          br04["s7_verified_at_utc"] = generated_at
          br04["s7_post_promotion_verified"] = True
          br04["s7_canonical_sha256"] = current_sha
          br04["s7_t20_passed"] = True
          br04["phase"] = "S7_VERIFIED"
          br04["blind_test_executed"] = False
          manifest["updated_at_utc"] = generated_at

          MANIFEST_PATH.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          status = STATUS_PATH.read_text(encoding="utf-8").rstrip()
          if "## BR-04 S7 — POST-PROMOTION VERIFIED" not in status:
              status += f"""

          ## BR-04 S7 — POST-PROMOTION VERIFIED

          - S7 run: **{S7_RUN_ID}**
          - Verified at: **{generated_at}**
          - Canonical SHA-256: `{current_sha}`
          - Approved candidate SHA-256: `{APPROVED_CANDIDATE}`
          - Canonical hash equals approved candidate: **YES**
          - BR04-T20 on canonical: **PASS**
          - Parts verified: **{t20["total_parts_read"]}/{t20["total_parts_declared"]}**
          - Rows verified: **{t20["rows_from_parts"]}/{t20["rows_declared"]}**
          - Reassembled canonical byte-identical: **YES**
          - Pre-promotion archive verified: **YES**
          - BR-04 staging/promotion lifecycle: **CLOSED**
          - Blind Test: **NOT EXECUTED**
          """
          STATUS_PATH.write_text(
              "\n".join(line.strip() for line in status.splitlines()) + "\n",
              encoding="utf-8",
          )

          success_evidence = {
              "schema": "br04_s7_post_promotion_v1.0",
              "phase": "S7",
              "s7_run_id": S7_RUN_ID,
              "generated_at_utc": generated_at,
              "base_canonical_sha256": APPROVED_BASE,
              "candidate_sha256": APPROVED_CANDIDATE,
              "canonical_sha256": current_sha,
              "result": "PASS",
              "checks": checks,
              "canonical_t20": t20,
              "details": details,
              "blind_test_executed": False,
              "br04_closed": True,
          }
          (EVIDENCE / "br04_s7_post_promotion.json").write_text(
              json.dumps(success_evidence, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("result=pass\n")

          print("BR-04 S7 PASS")
          print("canonical_sha256 =", current_sha)
          print("T20 =", "PASS")
          print("BR-04 lifecycle =", "CLOSED")
          print("Blind Test =", "NOT EXECUTED")
          PY

      - name: Commit S7 result
        if: always() && steps.s7.outcome == 'success'
        shell: bash
        run: |
          git config user.name "investment-os-data-bridge[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "data/current" \
            "data/staging/br04/${S1_RUN_ID}/evidence/br04_s7_post_promotion.json"

          if git diff --cached --quiet; then
            echo "No S7 changes to commit."
            exit 1
          fi

          if [ "${{ steps.s7.outputs.result }}" = "rollback" ]; then
            git commit -m "data: BR-04 S7 rollback after post-promotion failure"
          elif [ "${{ steps.s7.outputs.result }}" = "pass" ]; then
            git commit -m "data: BR-04 S7 verify promoted canonical"
          else
            echo "Unexpected S7 result: ${{ steps.s7.outputs.result }}"
            exit 1
          fi

          git push

      - name: Final summary
        if: always()
        run: |
          echo "S7 result: ${{ steps.s7.outputs.result }}"
          echo "Blind Test was NOT executed."
