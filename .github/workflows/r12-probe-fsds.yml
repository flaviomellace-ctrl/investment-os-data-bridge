name: R12 probe FSDS rows (diagnostic)
on:
  push:
    branches: ["claude/r12-pit-replay"]
    paths: ["pit/probe_fsds.json"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pandas
      - env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python src/probe_fsds.py
      - run: |
          git config user.name "investment-os-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pit/out/probe_fsds.txt
          git commit -m "R12 fsds probe ($GITHUB_RUN_ID)" || exit 0
          git pull --rebase -q origin claude/r12-pit-replay && git push
